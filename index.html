<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git &amp; GitHub Workshop — Participants</title>
  <meta name="description" content="Participants of the Git & GitHub workshop. Every card here was added by a pull request." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>GitHub Essentials Workshop</h1>
    </div>
  </header>

  <main class="wrap">
    <section id="participants" aria-label="Participants">
      <div class="section-head">
        <label class="search">
          <span class="visually-hidden">Search participants</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="Search by name, skill or username…" autocomplete="off" />
        </label>
      </div>

      <div class="grid" id="cardGrid"></div>
      <p class="empty" id="emptyState" hidden>No one matches that search. Try another name or skill.</p>
    </section>

  </main>
  <script src="js/participants.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
